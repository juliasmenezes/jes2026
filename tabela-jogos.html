<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>JES 2026 — Tabela de Jogos</title>
  <meta name="description" content="Todos os confrontos, horários, locais e resultados dos Jogos Estudantis SESI 2026.">
  <meta name="theme-color" content="#FFFFFF">
  <link rel="icon" type="image/png" href="img/logo-128.png">
  <script>(function () { var t; try { t = localStorage.getItem('jes2026_categoria') } catch (e) { } if (t !== 'manha' && t !== 'tarde') { t = new Date().getHours() < 12 ? 'manha' : 'tarde' } document.documentElement.setAttribute('data-turno', t); var m = document.querySelector('meta[name="theme-color"]'); if (m) m.setAttribute('content', t === 'tarde' ? '#0B0C0F' : '#FFFFFF') })();</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin>
  <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js">
  <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js">
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,700;0,800;0,900;1,700;1,800;1,900&family=Barlow:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="css/style.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0056b3">
  <link rel="apple-touch-icon" href="img/icon-192.png.png">
</head>

<body>
  <div class="boot" id="boot-loader" role="status" aria-live="polite">
    <div class="boot__arena"><img class="boot__logo" src="img/logo-128.png" alt="" width="96" height="96"></div>
    <div class="boot__quadra" aria-hidden="true"><span class="boot__sombra"></span><span class="boot__bola"></span>
    </div>
    <p class="boot__texto">Montando a tabela…</p>
  </div>

  <div id="admin-bar"></div>

  <header class="site-header">
    <div class="wrap site-header__inner">
      <a href="home.html" class="brand" aria-label="JES 2026 — página inicial">
        <img src="img/logo-128.png" alt="" width="46" height="46">
        <span class="brand__texto"><strong>JES 2026</strong><small>Jogos Estudantis SESI</small></span>
      </a>
      <nav class="site-nav" aria-label="Principal">
        <a href="home.html" class="site-nav__link"><svg class="ico" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="3" fill="currentColor" />
            <path
              d="M7.8 7.8a6 6 0 0 0 0 8.4M16.2 7.8a6 6 0 0 1 0 8.4M4.9 4.9a10 10 0 0 0 0 14.2M19.1 4.9a10 10 0 0 1 0 14.2" />
          </svg><span>Ao vivo</span></a>
        <a href="tabela-jogos.html" class="site-nav__link is-ativo" aria-current="page"><svg class="ico"
            viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
            stroke-linejoin="round" aria-hidden="true">
            <rect x="3" y="4.5" width="18" height="16.5" rx="2" />
            <path d="M16 2.5v4M8 2.5v4M3 10h18" />
          </svg><span>Jogos</span></a>
        <a href="classificacao.html" class="site-nav__link"><svg class="ico" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M4 21V12h4v9M10 21V5h4v16M16 21v-6h4v6" />
          </svg><span>Classificação</span></a>
        <a href="modalidades.html" class="site-nav__link"><svg class="ico" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0V4z" />
            <path d="M7 6H4v1a3 3 0 0 0 3 3M17 6h3v1a3 3 0 0 1-3 3" />
          </svg><span>Modalidades</span></a>
      </nav>
      <div class="site-header__acoes">
        <span class="sync-pill" id="sync-pill"></span>
        <div class="turno-switch" role="radiogroup" aria-label="Turno">
          <button type="button" class="turno-switch__opt" role="radio" data-turno-opcao="manha" aria-checked="false"
            title="Manhã · 7º e 8º anos"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor"
              stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="12" cy="12" r="4.5" />
              <path
                d="M12 1.5v2.5M12 20v2.5M4.6 4.6l1.8 1.8M17.6 17.6l1.8 1.8M1.5 12H4M20 12h2.5M4.6 19.4l1.8-1.8M17.6 6.4l1.8-1.8" />
            </svg><span>Manhã</span></button>
          <button type="button" class="turno-switch__opt" role="radio" data-turno-opcao="tarde" aria-checked="false"
            title="Tarde · 9º ano ao 3º ano EM"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor"
              stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M20.5 14.2A8.5 8.5 0 1 1 9.8 3.5a6.8 6.8 0 0 0 10.7 10.7z" />
            </svg><span>Tarde</span></button>
        </div>
        <a href="login.html" class="icon-btn" title="Área do organizador" aria-label="Área do organizador"><svg
            class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
            stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="8" r="4" />
            <path d="M4 21c.8-4.2 4-6.5 8-6.5s7.2 2.3 8 6.5" />
          </svg></a>
      </div>
    </div>
  </header>

  <main id="conteudo">
    <section class="wrap page-head">
      <span class="kicker">Turno da&nbsp;<span data-turno-nome>Manhã</span>&nbsp;· <span data-turno-descricao>7º e 8º
          anos</span></span>
      <h1>Tabela de <em>jogos</em></h1>
      <p>Todos os confrontos, horários e locais — com placar atualizado em tempo real.</p>
    </section>

    <section class="wrap">
      <div class="filtros painel">
        <div class="filtros__grupo">
          <span class="rotulo">Data</span>
          <div class="segmentado" id="filtro-data" role="group" aria-label="Data">
            <button type="button" data-valor="all" class="is-ativo" aria-pressed="true">Todas</button>
            <button type="button" data-valor="today" aria-pressed="false">Hoje</button>
            <button type="button" data-valor="next" aria-pressed="false">Próximas</button>
          </div>
        </div>
        <div class="filtros__grupo">
          <span class="rotulo">Status</span>
          <div class="segmentado" id="filtro-status" role="group" aria-label="Status">
            <button type="button" data-valor="all" class="is-ativo" aria-pressed="true">Todos</button>
            <button type="button" data-valor="AO VIVO" aria-pressed="false">Ao vivo</button>
            <button type="button" data-valor="EM BREVE" aria-pressed="false">Em breve</button>
            <button type="button" data-valor="FINALIZADO" aria-pressed="false">Encerrados</button>
          </div>
        </div>
        <label class="campo-select"><span>Modalidade</span><select id="filter-sport">
            <option value="all">Todas</option>
          </select></label>
        <label class="campo-select"><span>Gênero</span><select id="filter-gender">
            <option value="all">Todos</option>
            <option value="MASCULINO">Masculino</option>
            <option value="FEMININO">Feminino</option>
            <option value="MISTO">Misto</option>
          </select></label>
        <label class="campo-select"><span>Equipe</span><select id="filter-team">
            <option value="all">Todas</option>
          </select></label>
      </div>

      <div id="games-layout" class="jogos-layout">
        <div class="jogos-dias">
          <div class="jogos-grid">
            <div class="skeleton" style="height:170px"></div>
            <div class="skeleton" style="height:170px"></div>
            <div class="skeleton" style="height:170px"></div>
          </div>
        </div>
        <div class="skeleton" style="height:320px"></div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="wrap site-footer__inner">
      <div class="site-footer__marca"><img src="img/logo-128.png" alt="" width="34" height="34">
        <div><strong>JES 2026</strong><span>Jogos Estudantis SESI</span></div>
      </div>
      <span>Turno da <b data-turno-nome>Manhã</b> · <span data-turno-descricao>7º e 8º anos</span></span>
    </div>
  </footer>

  <script src="js/ui.js"></script>
  <script type="module" src="js/firebase-setup.js"></script>
  <script type="module" src="js/app.js"></script>
  <script src="js/tabela.js"></script>
</body>

</html>
