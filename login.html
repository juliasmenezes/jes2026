<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>JES 2026 — Acesso do Organizador</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#FFFFFF">
  <link rel="icon" type="image/png" href="img/logo-128.png">
  <script>(function(){var t;try{t=localStorage.getItem('jes2026_categoria')}catch(e){}if(t!=='manha'&&t!=='tarde'){t=new Date().getHours()<12?'manha':'tarde'}document.documentElement.setAttribute('data-turno',t);var m=document.querySelector('meta[name="theme-color"]');if(m)m.setAttribute('content',t==='tarde'?'#0B0C0F':'#FFFFFF')})();</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin>
  <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js">
  <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,700;0,800;0,900;1,700;1,800;1,900&family=Barlow:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="login-page">
  <main class="login">
    <section class="login__marca" aria-hidden="true">
      <img src="img/logo-512.png" alt="" width="190" height="190">
      <h1 class="login__titulo">Jogos Estudantis <em>SESI</em></h1>
      <ul class="login__features">
        <li><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3" fill="currentColor"/><path d="M7.8 7.8a6 6 0 0 0 0 8.4M16.2 7.8a6 6 0 0 1 0 8.4M4.9 4.9a10 10 0 0 0 0 14.2M19.1 4.9a10 10 0 0 1 0 14.2"/></svg>Placar ao vivo com poucos toques</li>
        <li><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0V4z"/><path d="M7 6H4v1a3 3 0 0 0 3 3M17 6h3v1a3 3 0 0 1-3 3"/></svg>Regras de cada esporte já embutidas</li>
        <li><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 1.5v2.5M12 20v2.5M1.5 12H4M20 12h2.5"/></svg>Turnos da manhã e da tarde separados</li>
      </ul>
    </section>

    <section class="login__form">
      <div class="login__form-topo">
        <a href="home.html" class="link-voltar"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>Voltar ao site</a>
        <div class="turno-switch" role="radiogroup" aria-label="Turno">
          <button type="button" class="turno-switch__opt" role="radio" data-turno-opcao="manha" aria-checked="false" title="Manhã · 7º e 8º anos"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4.5"/><path d="M12 1.5v2.5M12 20v2.5M4.6 4.6l1.8 1.8M17.6 17.6l1.8 1.8M1.5 12H4M20 12h2.5M4.6 19.4l1.8-1.8M17.6 6.4l1.8-1.8"/></svg><span>Manhã</span></button>
          <button type="button" class="turno-switch__opt" role="radio" data-turno-opcao="tarde" aria-checked="false" title="Tarde · 9º ano ao 3º ano EM"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.5 14.2A8.5 8.5 0 1 1 9.8 3.5a6.8 6.8 0 0 0 10.7 10.7z"/></svg><span>Tarde</span></button>
        </div>
      </div>

      <h2>Acesse o painel</h2>
      <p>Organizadores e mesários do JES 2026.</p>

      <form id="login-form" novalidate>
        <div class="field-group">
          <label for="email">E-mail</label>
          <div class="campo-icone">
            <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3.5 6.5l8.5 6.5 8.5-6.5"/></svg>
            <input type="email" id="email" name="email" placeholder="seu@email.com" required autocomplete="username" inputmode="email">
          </div>
        </div>
        <div class="field-group">
          <label for="senha">Senha</label>
          <div class="campo-icone">
            <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4.5" y="10.5" width="15" height="10" rx="2"/><path d="M8 10.5V7a4 4 0 0 1 8 0v3.5"/></svg>
            <input type="password" id="senha" name="senha" placeholder="Sua senha" required autocomplete="current-password">
            <button type="button" class="campo-icone__acao" id="mostrar-senha" aria-pressed="false">Mostrar</button>
          </div>
        </div>
        <p class="form-erro" id="login-erro" role="alert" hidden></p>
        <button type="submit" class="btn btn--primario btn--lg btn--bloco btn-submit">Entrar no painel</button>
      </form>
    </section>
  </main>

  <script src="js/ui.js"></script>
  <script type="module" src="js/firebase-setup.js"></script>
  <script type="module" src="js/app.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
